<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #0b0b12;
      color: #f5f5ff;
    }
    h2 {
      margin: 0 0 16px;
      color: #ff6bd6;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      background: #151521;
      border-radius: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
    }
    .dot.online { background: #7dff9a; }
    .dot.offline { background: #ff9b9b; }
    
    /* Big toggle switch */
    .big-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #151521;
      border-radius: 8px;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .big-toggle.disabled {
      opacity: 0.5;
    }
    .toggle-label {
      font-size: 16px;
      font-weight: bold;
    }
    .toggle-switch {
      width: 50px;
      height: 28px;
      background: #34c759;
      border-radius: 14px;
      position: relative;
      transition: background 0.2s;
    }
    .toggle-switch.off {
      background: #8e8e93;
    }
    .toggle-knob {
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 12px;
      position: absolute;
      top: 2px;
      right: 2px;
      transition: right 0.2s;
    }
    .toggle-switch.off .toggle-knob {
      right: 24px;
    }
    
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      background: #ff6bd6;
      color: #1a0b1f;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #26263a;
      color: #f5f5ff;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
      text-align: center;
    }
    .settings {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #26263a;
    }
    .settings h3 {
      margin: 0 0 8px;
      color: #ff6bd6;
      font-size: 13px;
    }
    .site-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
    }
    .site-row input[type="checkbox"] { accent-color: #ff6bd6; }
    .custom-site {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .custom-site input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px;
      border: 1px solid #33334a;
      border-radius: 5px;
      background: #151521;
      color: #f5f5ff;
    }
    .custom-entry {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 11px;
    }
    .custom-entry button { width: auto; margin: 0; padding: 4px 8px; }
  </style>
</head>
<body>
  <h2>
    🎀 BambiBrowser
    <span id="modeBadge" style="font-size: 11px; padding: 2px 8px; background: #26263a; border-radius: 12px; margin-left: auto;">v6.5.2</span>
  </h2>
  
  <!-- Big Enable/Disable Toggle -->
  <div class="big-toggle" id="enableToggle">
    <span class="toggle-label" id="toggleLabel">Enabled</span>
    <div class="toggle-switch" id="toggleSwitch">
      <div class="toggle-knob"></div>
    </div>
  </div>
  
  <div class="status-row">
    <span class="dot" id="serverDot"></span>
    <span id="serverStatus">Checking...</span>
  </div>
  
  <button id="openApp" class="secondary">Open Desktop App</button>

  <section class="settings" aria-label="Supported sites">
    <h3>Supported sites</h3>
    <div id="siteList"></div>
    <div class="custom-site">
      <input id="customLabel" type="text" placeholder="Custom site name">
      <input id="customHosts" type="text" placeholder="Hosts, e.g. example.com, *.example.com">
      <input id="customSelector" type="text" value="video" placeholder="Video CSS selector">
      <button id="addCustomSite">Add custom site</button>
    </div>
    <div class="detector-import-export">
      <h4>Detector Import/Export</h4>
      <button id="exportDetectors">Export Detectors</button>
      <input type="file" id="importDetectorFile" accept=".json,.js" style="display: none;">
      <button id="importDetectorTrigger">Import Detector</button>
    </div>
  </section>

  <div class="hint" id="hintText">
    App online → MPV fullscreen<br>
    App offline → Browser fullscreen
  </div>
  
  <script src="site_config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
